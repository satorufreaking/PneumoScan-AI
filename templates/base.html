<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Pneumonia Detection - Clinical AI Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Prevent theme flash on initial load -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('clinical_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}" />
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </body>
</html>
